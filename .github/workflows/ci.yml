name: CI

# Single entry point for pull requests and master pushes. Owns the triggers,
# the path filters and the draft/label gate, then calls one reusable workflow
# per platform or check. The platform workflows keep workflow_dispatch for
# manual runs. Jobs skipped by the gate count as passed for branch protection,
# so a documentation-only PR does not block on required checks.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/mergeable.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/mergeable.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Drafts wait for ready_for_review; the No-Jenkins / No Jenkins / Stale labels
  # skip everything, as they did on Jenkins. Also decides whether the add-on
  # build system changed, which is the only case worth exercising the reusable
  # add-on workflow from this repository.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      addons: ${{ steps.filter.outputs.addons }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, '|') }}
        run: |
          run=true
          if [ "${EVENT}" = "pull_request" ]; then
            [ "${DRAFT}" = "true" ] && run=false
            case "|${LABELS}|" in
              *"|No-Jenkins|"*|*"|No Jenkins|"*|*"|Stale|"*) run=false ;;
            esac
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "run=${run} (event=${EVENT} draft=${DRAFT} labels=${LABELS})"

      - uses: actions/checkout@v7
        if: steps.decide.outputs.run == 'true'

      - uses: dorny/paths-filter@v3
        if: steps.decide.outputs.run == 'true'
        id: filter
        with:
          filters: |
            addons:
              - .github/workflows/build-addon.yml
              - cmake/addons/**
              - tools/depends/**
              - tools/buildsteps/windows/**

  lint:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/lint.yml

  linux:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/e2e-linux.yml

  linux-x11:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/e2e-linux-x11.yml

  macos:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/e2e-macos.yml
    secrets: inherit

  windows:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/e2e-windows.yml

  android:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/e2e-android.yml
    secrets: inherit

  apple-simulator:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/e2e-apple-simulator.yml

  apple-device:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/build-apple-device.yml

  webos:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/build-webos.yml

  static-analysis:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/static-analysis.yml

  # peripheral.joystick on one platform per code path, only when the add-on
  # build system or the reusable workflow changed.
  addon:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.addons == 'true'
    uses: ./.github/workflows/build-addon.yml
    with:
      addon: peripheral.joystick
      addon_repository: xbmc/peripheral.joystick
      addon_ref: Piers
      kodi_repository: ${{ github.repository }}
      kodi_ref: ${{ github.sha }}
      platforms: '["android-aarch64","osx-arm64","windows-x86_64"]'
      retention_days: 7
