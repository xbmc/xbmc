name: CI

# Single entry point for pull requests, master pushes and manual runs, calling
# one reusable workflow per check and per platform leg, so each leg's E2E run
# waits for its own build only. Pull requests are path-filtered
# in the gate rather than with paths-ignore: jobs the gate skips count as
# passed, while a workflow that never starts leaves required checks pending.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, linux, windows, android, apple, webos]
        default: all
      configuration:
        description: >
          Debug or Release for every platform. Default keeps what Jenkins builds
          (Debug on Linux and Apple, Release on Windows and webOS, per ABI on
          Android); on the Release-default platforms a run with debug logging
          enabled builds Debug.
        type: choice
        options: [Default, Debug, Release]
        default: Default
      addons:
        description: >
          Space-separated binary add-on ids or patterns to build and bundle,
          e.g. "peripheral.joystick inputstream.adaptive inputstream.ffmpegdirect pvr.*".
        type: string
        default: peripheral.joystick
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/mergeable.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Drafts wait for ready_for_review; the No-Jenkins, No Jenkins and Stale
  # labels skip everything, as on Jenkins, and so do documentation-only changes.
  gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run == 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true') }}
      platform: ${{ steps.decide.outputs.platform }}
      configuration: ${{ steps.decide.outputs.configuration }}
      addons: ${{ steps.decide.outputs.addons }}
      addons_changed: ${{ steps.filter.outputs.addons }}
      addons_ref: ${{ steps.addons-ref.outputs.ref }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, '|') }}
          PLATFORM: ${{ inputs.platform }}
          CONFIGURATION: ${{ inputs.configuration }}
          ADDONS: ${{ inputs.addons }}
        run: |
          run=true
          if [ "${EVENT}" = "pull_request" ]; then
            [ "${DRAFT}" = "true" ] && run=false
            case "|${LABELS}|" in
              *"|No-Jenkins|"*|*"|No Jenkins|"*|*"|Stale|"*) run=false ;;
            esac
          fi
          if [ "${CONFIGURATION}" = Default ]; then CONFIGURATION=""; fi
          {
            echo "run=${run}"
            echo "platform=${PLATFORM:-all}"
            echo "configuration=${CONFIGURATION}"
            echo "addons=${ADDONS:-peripheral.joystick}"
          } >> "$GITHUB_OUTPUT"
          echo "run=${run} platform=${PLATFORM:-all} (event=${EVENT} draft=${DRAFT} labels=${LABELS})"

      - uses: actions/checkout@v7
        if: steps.decide.outputs.run == 'true'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: steps.decide.outputs.run == 'true'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/CODEOWNERS'
              - '!.github/FUNDING.yml'
              - '!.github/mergeable.yml'
            addons:
              - .github/workflows/build-addon.yml
              - cmake/addons/**
              - tools/depends/**
              - tools/buildsteps/windows/**

      # The binary add-on branch this tree builds against.
      - id: addons-ref
        if: steps.decide.outputs.run == 'true'
        run: echo "ref=$(awk '{ print $3 }' cmake/addons/bootstrap/repositories/binary-addons.txt)" >> "$GITHUB_OUTPUT"

  lint:
    needs: gate
    if: needs.gate.outputs.run == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/lint.yml

  linux:
    name: linux (${{ matrix.platform }} ${{ endsWith(matrix.runner, '-arm') && 'arm64' || 'x86_64' }})
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["all","linux"]'), needs.gate.outputs.platform)
    strategy:
      fail-fast: false
      matrix:
        platform: [gbm, wayland, x11]
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
        exclude:
          - platform: x11
            runner: ubuntu-26.04-arm
    uses: ./.github/workflows/e2e-linux.yml
    with:
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      configuration: ${{ needs.gate.outputs.configuration }}
      addons: ${{ needs.gate.outputs.addons }}

  windows:
    name: windows (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["all","windows"]'), needs.gate.outputs.platform)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64, buildsteps: x64, platform: x64, tests: true, e2e: true }
          - { name: win32, buildsteps: win32, platform: x86, tests: true, e2e: false }
          - { name: arm64, buildsteps: arm64, platform: arm64, tests: false, e2e: false }
          - { name: uwp-x64, buildsteps: x64-uwp, platform: x64-uwp, tests: false, e2e: false }
    uses: ./.github/workflows/e2e-windows.yml
    with:
      name: ${{ matrix.name }}
      buildsteps: ${{ matrix.buildsteps }}
      platform: ${{ matrix.platform }}
      tests: ${{ matrix.tests }}
      e2e: ${{ matrix.e2e }}
      configuration: ${{ needs.gate.outputs.configuration }}
      addons: ${{ needs.gate.outputs.addons }}

  # Debug for the emulator leg and Release for the shipped ABIs, as on Jenkins.
  android:
    name: android (${{ matrix.abi }})
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["all","android"]'), needs.gate.outputs.platform)
    # packages: write publishes tools/depends prefixes to ghcr.io.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: x86_64, host: x86_64-linux-android, config: debug, e2e: true }
          - { abi: arm64-v8a, host: aarch64-linux-android, config: release, e2e: false }
          - { abi: armeabi-v7a, host: arm-linux-androideabi, config: release, e2e: false }
          - { abi: x86, host: i686-linux-android, config: release, e2e: false }
    uses: ./.github/workflows/e2e-android.yml
    with:
      abi: ${{ matrix.abi }}
      host: ${{ matrix.host }}
      default_configuration: ${{ matrix.config }}
      e2e: ${{ matrix.e2e }}
      configuration: ${{ needs.gate.outputs.configuration }}
      addons: ${{ needs.gate.outputs.addons }}

  # Xcode as Jenkins pins it for iOS and tvOS; macOS uses 16.4, since Jenkins'
  # 15.2 is not on macos-15.
  apple:
    name: apple (${{ matrix.kind == 'device' && format('{0}-device', matrix.platform) || matrix.depends_platform }})
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["all","apple"]'), needs.gate.outputs.platform)
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: macos, platform: macos, depends_platform: macos, xcode: '16.4' }
          - { kind: simulator, platform: ios, depends_platform: ios-simulator, xcode: '26.3' }
          - { kind: simulator, platform: tvos, depends_platform: tvos-simulator, xcode: '26.3' }
          - { kind: device, platform: ios, depends_platform: ios, xcode: '26.3', xcodebuild_args: -target ipa }
          - { kind: device, platform: tvos, depends_platform: tvos, xcode: '26.3', xcodebuild_args: -target ipa }
    uses: ./.github/workflows/apple.yml
    with:
      kind: ${{ matrix.kind }}
      platform: ${{ matrix.platform }}
      depends_platform: ${{ matrix.depends_platform }}
      xcode: ${{ matrix.xcode }}
      xcodebuild_args: ${{ matrix.xcodebuild_args }}
      configuration: ${{ needs.gate.outputs.configuration }}
      addons: ${{ needs.gate.outputs.addons }}

  webos:
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(fromJSON('["all","webos"]'), needs.gate.outputs.platform)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-webos.yml
    with:
      configuration: ${{ needs.gate.outputs.configuration }}
      addons: ${{ needs.gate.outputs.addons }}

  # Full runs only, not when a manual run targets one platform.
  static-analysis:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.platform == 'all'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/static-analysis.yml

  # Only when the add-on build system or the reusable workflow changed.
  addon:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.platform == 'all' && needs.gate.outputs.addons_changed == 'true'
    uses: ./.github/workflows/build-addon.yml
    with:
      addon: peripheral.joystick
      addon_repository: xbmc/peripheral.joystick
      addon_ref: ${{ needs.gate.outputs.addons_ref }}
      kodi_repository: ${{ github.repository }}
      kodi_ref: ${{ github.sha }}
      platforms: '["android-aarch64","osx-arm64","windows-x86_64"]'
      retention_days: 7
