name: Focused AudioEngine Tests

on:
  push:
    branches:
      - pr/edl-mute-truehd-passthrough
    paths:
      - ".github/workflows/focused-audioengine-tests.yml"
      - "xbmc/cores/AudioEngine/**"
      - "xbmc/cores/AudioEngine/Utils/**"
      - "xbmc/cores/AudioEngine/Utils/test/**"
      - "cmake/**"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focused-audioengine-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audioengine-tests:
    name: Build and run focused AudioEngine tests
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable Kodi build dependency repository
        run: |
          sudo add-apt-repository -y -s ppa:team-xbmc/xbmc-nightly
          sudo apt-get update

      - name: Install Kodi build dependencies
        run: |
          sudo apt-get build-dep -y kodi

      - name: Configure Kodi test build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCORE_PLATFORM_NAME=x11 \
            -DAPP_RENDER_SYSTEM=gl \
            -DENABLE_TESTING=ON \
            -DENABLE_INTERNAL_GTEST=ON \
            -DENABLE_INTERNAL_EXIV2=ON \
            -DENABLE_INTERNAL_FFMPEG=ON \
            -DENABLE_PYTHON=OFF \
            -DENABLE_UPNP=OFF \
            -DENABLE_AIRTUNES=OFF \
            -DENABLE_OPTICAL=OFF

      - name: Build Kodi test executable
        run: |
          cmake --build build --target kodi-test --parallel 4

      - name: Run focused parser and MAT packer tests
        run: |
          ./build/kodi-test \
            --gtest_filter='TestAEStreamParser.*:TestPackerMAT.*'
