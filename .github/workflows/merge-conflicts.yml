name: Merge conflicts

# Replaces Jenkins' GitHub-ConflictChecker: labels pull requests that no
# longer merge "Rebase needed" and comments once. pull_request_target can label
# fork pull requests; nothing from the pull request is checked out or run.

on:
  push:
    branches: [master]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

# One scan at a time: parallel runs could comment twice.
concurrency:
  group: merge-conflicts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    # The action retries while GitHub still computes mergeability.
    timeout-minutes: 30
    steps:
      - uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          dirtyLabel: Rebase needed
          commentOnDirty: This pull request has conflicts with its target branch and needs a rebase.
