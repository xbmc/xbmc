name: E2E (Windows)

# End-to-end smoke test for docs/E2E-TESTING.md, Windows edition.
#
# Builds Kodi from source on a GitHub-hosted Windows runner and runs the exact same
# tools/e2e scenario suite against kodi.exe unmodified, via the existing desktop
# KodiProcess launcher (tools/e2e/driver/launcher.py) - Windows needs no new launcher
# class or conftest.py change at all: kodi.exe supports -p/--portable through the same
# CAppParamParser code path as macOS/Linux (unlike Android/iOS, which have none), and
# Python's subprocess.Popen.send_signal(SIGTERM) is already special-cased on Windows to
# call TerminateProcess() rather than raise.
#
# Unlike the other source-built jobs, Windows doesn't use tools/depends'
# autotools (./bootstrap/./configure/make) at all: third-party dependencies are
# downloaded as prebuilt binary packages from mirrors.kodi.tv (tools/buildsteps/windows/
# download-dependencies.bat) plus an MSYS2 environment for the handful of things built
# from source (download-msys2.bat) - see docs/README.Windows.md sections 4 and 6 for the
# documented manual build flow this mirrors.

on:
  workflow_dispatch:
  push:
    branches: [master]
  # Every commit of a PR, once it is out of draft: `synchronize` covers pushes to
  # an open PR, `ready_for_review` starts a run when a draft is marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: e2e-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-smoke:
    # Draft PRs are skipped - they run as soon as they are marked ready for review.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    # windows-2022 ships VS2022 (17.14.x) and CMake 3.31.6 out of the box - both above
    # docs/README.Windows.md's minimums, and pinned rather than windows-latest so the
    # toolchain stays predictable.
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}\.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
      CCACHE_BASEDIR: ${{ github.workspace }}
      # Larger than the 1G the other jobs use: /Z7 puts debug info inside each object
      # file rather than a shared PDB, so cached objects are substantially bigger.
      CCACHE_MAXSIZE: "2G"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ninja rather than the Visual Studio generator: MSBuild ignores
      # CMAKE_<LANG>_COMPILER_LAUNCHER, which is how Kodi's own FindCCache.cmake wires
      # ccache in, so with -G "Visual Studio" the cache would be configured and then
      # silently unused. Ninja honours it, at the cost of having to enter the MSVC
      # environment ourselves - see the vcvarsall preamble below.
      - name: Install ccache and ninja
        shell: pwsh
        run: |
          choco install ccache ninja -y --no-progress
          ccache --version
          ninja --version

      # project/BuildDependencies/scripts/*.list pins the prebuilt dependency package
      # versions, and tools/buildsteps/windows pins the MSYS2 revision/package set
      # (download-msys2.bat's own "msysver") - hash both so the cache only invalidates
      # when what actually gets downloaded/installed would change, not on every push.
      - name: Restore Windows build dependencies (prebuilt packages + MSYS2)
        id: depends-cache
        uses: actions/cache/restore@v6
        with:
          path: project\BuildDependencies
          key: windows-x64-depends-${{ hashFiles('project/BuildDependencies/scripts/**', 'tools/buildsteps/windows/**') }}

      # Prebuilt package mirror pull - see tools/buildsteps/windows/download-dependencies.bat.
      # Working directory matters: the script computes its own repo-root WORKSPACE as
      # three levels up from its own path, so it must be run from underneath
      # tools/buildsteps/windows/ rather than invoked with a full path from elsewhere.
      - name: Download prebuilt Windows dependencies
        shell: cmd
        working-directory: tools\buildsteps\windows\x64
        run: download-dependencies.bat

      - name: Download and set up MSYS2 build environment
        shell: cmd
        working-directory: tools\buildsteps\windows\x64
        run: download-msys2.bat

      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-x64-ccache-${{ github.sha }}
          restore-keys: |
            windows-x64-ccache-

      # vcvarsall puts the MSVC toolchain on PATH, which the Visual Studio generator
      # would have located by itself. Its effect does not outlive the step, so every
      # step that compiles repeats the preamble; vswhere is used rather than a
      # hardcoded path because the installed VS edition differs between runner images.
      #
      # CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded is what makes caching possible at
      # all: the default /Zi routes debug info through mspdbsrv into a shared PDB,
      # which ccache cannot reproduce from a cache hit, so it declines to cache. /Z7
      # puts the debug info in the object file instead. The variable is honoured
      # because CMP0141 is NEW here - CMakeLists.txt raises cmake_minimum_required to
      # 3.30.6 under if(WIN32).
      # CMAKE_VS_WINDOWS_TARGET_PLATFORM_VERSION is passed by hand because
      # cmake/scripts/windows/ArchSetup.cmake:4 gates on it to enforce a minimum
      # Windows SDK, and only the Visual Studio generator populates it - under Ninja it
      # is empty, compares less than the minimum, and the configure aborts with
      # "Detected Windows SDK version is .". vcvarsall exports the version it actually
      # selected as WindowsSDKVersion, with a trailing backslash to strip.
      - name: Configure Kodi
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          echo Windows SDK selected by vcvarsall: %WindowsSDKVersion%
          cmake -G Ninja -B build -S . ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded ^
            -DCMAKE_VS_WINDOWS_TARGET_PLATFORM_VERSION=%WindowsSDKVersion:~0,-1%

      - name: Build Kodi
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build

      # kodi-test is EXCLUDE_FROM_ALL (CMakeLists.txt), so the default target above
      # does not build it. It whole-archive links the whole app, so this is a real
      # link step rather than a few extra objects.
      - name: Build unit tests
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake --build build --target kodi-test

      - name: Upload unit test binary
        uses: actions/upload-artifact@v7
        with:
          name: kodi-test-windows
          path: build/kodi-test.exe
          if-no-files-found: error
          retention-days: 7

      - name: Show ccache stats
        if: always()
        shell: pwsh
        run: ccache -s

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: "tools/e2e/uv.lock"

      - name: Run E2E smoke test
        working-directory: tools/e2e
        env:
          # No Debug/ segment: Ninja is a single-config generator, so the binary and
          # its portable_data land directly under build/.
          KODI_BINARY: ${{ github.workspace }}\build\kodi.exe
        run: uv run pytest scenarios -v --junitxml=../../e2e-results.xml

      # Runs whatever the E2E scenarios did, so one run reports both. Executed from
      # the build tree because CUtil::GetHomePath() resolves special://xbmc by walking
      # up from the binary, and that is where the reference data the tests read
      # (cmake/installdata/test-reference-data.txt) was copied at configure time.
      - name: Run unit tests
        if: '!cancelled()'
        shell: cmd
        working-directory: build
        run: kodi-test.exe

      - name: Upload Kodi log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kodi-windows-log
          # kodi.log sits at the profile root here, not under temp/:
          # InitDirectoriesWin32() (xbmc/settings/SettingsComponent.cpp) points
          # special://logpath at the profile folder on Windows alone. cache/ is picked
          # up too since that is what special://temp maps to.
          path: |
            build/portable_data/kodi.log
            build/portable_data/temp/process-output.log
            build/portable_data/cache/*.log
          if-no-files-found: warn

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kodi-windows-screenshot
          path: build/portable_data/screenshots/*.png
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-windows
          path: e2e-results.xml
          if-no-files-found: warn

      # Skipped on an exact key hit, and !cancelled() so a cancelled run doesn't
      # persist a half-populated tree under a key a later run would trust.
      - name: Save Windows build dependencies cache
        if: '!cancelled() && steps.depends-cache.outputs.cache-hit != ''true'''
        uses: actions/cache/save@v6
        with:
          path: project\BuildDependencies
          key: windows-x64-depends-${{ hashFiles('project/BuildDependencies/scripts/**', 'tools/buildsteps/windows/**') }}

      - name: Save ccache
        # Not on pull_request: cache entries are immutable, so every push to a
        # PR would add another entry rather than replace one, and the repo's 10GB
        # budget then evicts the entries that are actually useful. PR runs still restore.
        if: "!cancelled() && github.event_name != 'pull_request'"
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-x64-ccache-${{ github.sha }}
