name: E2E (Windows)

# Builds Kodi for Windows with the same scripts Jenkins uses
# (tools/buildsteps/windows/<arch>/*.bat, docs/README.Windows.md): prebuilt
# dependency packages from mirrors.kodi.tv plus an MSYS2 environment, the
# Visual Studio generator through BuildSetup.bat, peripheral.joystick through
# make-addons.bat, and the NSIS installer (or the UWP .msix). The x64 leg's
# staged application directory feeds the E2E run below through the same desktop
# launcher as macOS/Linux (kodi.exe supports -p/--portable).
#
# BuildSetup.bat hardcodes the Visual Studio generator and its Release\ layout,
# so ccache is not used here; the dependency downloads are cached instead.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/mergeable.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/mergeable.yml'

permissions:
  contents: read

concurrency:
  group: e2e-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BINARY_ADDONS: peripheral.joystick

jobs:
  build:
    # Drafts are skipped; ready_for_review starts the first run.
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'No-Jenkins') && !contains(github.event.pull_request.labels.*.name, 'No Jenkins') && !contains(github.event.pull_request.labels.*.name, 'Stale'))
    # Pinned so the toolchain stays predictable; VS2022, the Windows 11 SDK,
    # the UWP workload and NSIS are all on the image.
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # steps: the tools/buildsteps/windows subdirectory; platform: the
          # kodi-build.<platform> tree BuildSetup.bat creates.
          - name: x64
            steps: x64
            platform: x64
            tests: true
          - name: win32
            steps: win32
            platform: x86
            tests: true
          - name: arm64
            steps: arm64
            platform: arm64
            tests: false
          - name: uwp-x64
            steps: x64-uwp
            platform: x64-uwp
            tests: false
    steps:
      - uses: actions/checkout@v7

      # project/BuildDependencies/scripts/*.list pins the package versions and
      # tools/buildsteps/windows pins the MSYS2 revision, so the cache only
      # changes when the downloads would. download-dependencies.bat re-extracts
      # from downloads\ on every run, so only the downloads are worth keeping.
      - name: Restore Windows build dependencies
        id: depends-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            project\BuildDependencies\downloads
            project\BuildDependencies\downloads2
            project\BuildDependencies\msys64
          key: windows-${{ matrix.name }}-depends-${{ hashFiles('project/BuildDependencies/scripts/**', 'tools/buildsteps/windows/**') }}

      # The scripts derive the repo root from their own location, so they must
      # run from their own directory. Each wrapper calls vswhere.bat, which puts
      # MSVC on PATH for that cmd process only.
      - name: Download prebuilt Windows dependencies
        shell: cmd
        working-directory: tools\buildsteps\windows\${{ matrix.steps }}
        run: download-dependencies.bat

      - name: Download and set up MSYS2 build environment
        shell: cmd
        working-directory: tools\buildsteps\windows\${{ matrix.steps }}
        run: download-msys2.bat sh

      # Installs into project\Win32BuildSetup\BUILD_WIN32\addons, which the NSIS
      # script and the UWP deployment content pick up. make-addons.bat records
      # per-add-on results in cmake\addons\.success and .failure and returns 0
      # for a failed add-on, matching Jenkins' non-fatal handling.
      - name: Build binary add-ons
        shell: cmd
        working-directory: tools\buildsteps\windows\${{ matrix.steps }}
        run: make-addons.bat "%BINARY_ADDONS%"

      - name: Report add-on results
        if: always()
        shell: bash
        run: |
          {
            echo "### Binary add-ons"
            if [ -s cmake/addons/.success ]; then echo "Built:"; sed 's/^/- /' cmake/addons/.success; fi
            if [ -s cmake/addons/.failure ]; then echo "Failed:"; sed 's/^/- /' cmake/addons/.failure; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s cmake/addons/.failure ]; then
            echo "::warning::Binary add-ons failed to build: $(tr '\n' ' ' < cmake/addons/.failure)"
          fi

      # Configures with the Visual Studio generator, builds Release, stages the
      # application under project\Win32BuildSetup\BUILD_WIN32 and creates the
      # NSIS installer (desktop) or copies the .msix, .appxsym and .cer (UWP).
      # nobinaryaddons: the add-ons were built above. noclean: keep the tree.
      - name: Build Kodi and create the installer
        shell: cmd
        working-directory: tools\buildsteps\windows\${{ matrix.steps }}
        run: BuildSetup.bat nobinaryaddons noclean noprompt sh

      - name: Save Windows build dependencies cache
        if: '!cancelled() && github.event_name != ''pull_request'' && steps.depends-cache.outputs.cache-hit != ''true'''
        uses: actions/cache/save@v6
        with:
          path: |
            project\BuildDependencies\downloads
            project\BuildDependencies\downloads2
            project\BuildDependencies\msys64
          key: windows-${{ matrix.name }}-depends-${{ hashFiles('project/BuildDependencies/scripts/**', 'tools/buildsteps/windows/**') }}

      - name: Upload installer
        if: matrix.steps != 'x64-uwp'
        uses: actions/upload-artifact@v7
        with:
          name: kodi-installer-windows-${{ matrix.name }}
          path: |
            project/Win32BuildSetup/*Setup-*.exe
            project/Win32BuildSetup/*Setup-*.pdb
          if-no-files-found: error
          retention-days: 7

      - name: Upload UWP package
        if: matrix.steps == 'x64-uwp'
        uses: actions/upload-artifact@v7
        with:
          name: kodi-installer-windows-${{ matrix.name }}
          path: project/UWPBuildSetup/*
          if-no-files-found: error
          retention-days: 7

      # The staged application directory is what the installer packs: kodi.exe,
      # the dependency DLLs, addons, media, system and userdata. Uploaded before
      # the unit tests run so the e2e job still gets a build when a unit test
      # fails.
      - name: Upload runtime for E2E
        if: matrix.name == 'x64'
        uses: actions/upload-artifact@v7
        with:
          name: kodi-build-windows
          path: project/Win32BuildSetup/BUILD_WIN32/application
          retention-days: 7

      # Builds kodi-test with the same generator and runs it from the build
      # tree, writing gtest XML with JUnit "skipped" markers.
      - name: Run unit tests
        if: matrix.tests
        shell: cmd
        working-directory: tools\buildsteps\windows\${{ matrix.steps }}
        run: run-tests.bat

      - uses: ./.github/actions/report-unit-tests
        if: always() && matrix.tests
        with:
          name: windows-${{ matrix.name }}
          results: kodi-build.${{ matrix.platform }}/gtestresults.xml

  e2e:
    needs: build
    # Matrix legs share one job result, so this runs once every leg is done;
    # download-artifact fails clearly when the x64 build never uploaded.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: kodi-build-windows
          path: build

      # kodi.log sits at the profile root on Windows alone: InitDirectoriesWin32()
      # points special://logpath there and special://temp at cache/.
      - uses: ./.github/actions/run-e2e
        with:
          name: windows
          kodi-binary: ${{ github.workspace }}\build\kodi.exe
          log-paths: |
            build/portable_data/kodi.log
            build/portable_data/temp/process-output.log
            build/portable_data/cache/*.log
          screenshot-glob: build/portable_data/screenshots/*.png
