name: E2E (Linux)

# Builds Kodi's GBM, Wayland and X11 backends, packages each with CPack's DEB
# generator and runs tools/e2e against the installed packages. GBM and Wayland
# build against Ubuntu 24.04's own packages on x86_64 and arm64, as
# docs/README.Linux.md documents; GBM gets a display from the vkms virtual KMS
# driver, Wayland from a headless Weston, both rendering GLES through Mesa's
# llvmpipe, so the real DRM/GBM/EGL/GLES path is exercised but GPU drivers and
# hardware decode are not. X11 builds desktop OpenGL/GLX instead
# (xbmc/rendering/gl, GLContextGLX) under Xvfb, on Ubuntu 22.04 because
# xbmc/windowing/X11/GLContextEGL.h includes <EGL/eglextchromium.h>, which Mesa
# stopped shipping when EGL headers moved to libglvnd - 22.04's libegl1-mesa-dev
# is the newest Ubuntu that still has it. 22.04 is also old enough that ffmpeg,
# TagLib, fmt, spdlog, exiv2, flatbuffers, dav1d and SWIG all have to be built
# internally there (without dav1d the internal ffmpeg has no AV1 decoder and
# TestVideoCodecPictureFormat fails); once X11 builds without that header this
# leg should move to 24.04 and drop most of those flags. Every leg also builds
# peripheral.joystick against the same packages.

# Called from ci.yml, which owns the triggers, path filters, the draft/label
# gate and the manual-run inputs.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # docs/README.Linux.md section 3 minus optional features, plus what
          # the DEB generator needs (dpkg-dev, fakeroot, lsb-release).
          # libmicrohttpd-dev is not optional here: without it HAS_WEB_SERVER is
          # undefined and the JSON-RPC port the suite drives never opens.
          # libgif/libjpeg are for TexturePacker.
          - platform: gbm
            runner: ubuntu-24.04
            packages: >-
              build-essential cmake gawk gperf gettext libtool meson nasm
              ninja-build pkg-config bison python3-dev unzip zip ccache uuid-dev
              dpkg-dev fakeroot lsb-release
              libass-dev libcurl4-openssl-dev libexiv2-dev libflatbuffers-dev
              libfmt-dev libfreetype-dev libfribidi-dev libfstrcmp-dev
              libharfbuzz-dev liblzo2-dev libpcre2-dev libssl-dev libsqlite3-dev
              libtinyxml-dev zlib1g-dev libcdio-dev libcdio++-dev libgtest-dev
              libgif-dev libjpeg-dev nlohmann-json3-dev libmicrohttpd-dev
              libunistring-dev libspdlog-dev libtinyxml2-dev libcrossguid-dev
              libdbus-1-dev libasound2-dev libdav1d-dev
              libdrm-dev libxkbcommon-dev
              libegl-dev libegl1 libegl-mesa0 libgles2-mesa-dev libgl1-mesa-dri
              libinput-dev libudev-dev libdisplay-info-dev libgbm-dev
            cmake_flags: >-
              -DCORE_PLATFORM_NAME=gbm -DAPP_RENDER_SYSTEM=gles
              -DENABLE_INTERNAL_FFMPEG=ON -DENABLE_INTERNAL_TAGLIB=ON -DENABLE_INTERNAL_SWIG=ON
          - platform: gbm
            runner: ubuntu-24.04-arm
            packages: >-
              build-essential cmake gawk gperf gettext libtool meson nasm
              ninja-build pkg-config bison python3-dev unzip zip ccache uuid-dev
              dpkg-dev fakeroot lsb-release
              libass-dev libcurl4-openssl-dev libexiv2-dev libflatbuffers-dev
              libfmt-dev libfreetype-dev libfribidi-dev libfstrcmp-dev
              libharfbuzz-dev liblzo2-dev libpcre2-dev libssl-dev libsqlite3-dev
              libtinyxml-dev zlib1g-dev libcdio-dev libcdio++-dev libgtest-dev
              libgif-dev libjpeg-dev nlohmann-json3-dev libmicrohttpd-dev
              libunistring-dev libspdlog-dev libtinyxml2-dev libcrossguid-dev
              libdbus-1-dev libasound2-dev libdav1d-dev
              libdrm-dev libxkbcommon-dev
              libegl-dev libegl1 libegl-mesa0 libgles2-mesa-dev libgl1-mesa-dri
              libinput-dev libudev-dev libdisplay-info-dev libgbm-dev
            cmake_flags: >-
              -DCORE_PLATFORM_NAME=gbm -DAPP_RENDER_SYSTEM=gles
              -DENABLE_INTERNAL_FFMPEG=ON -DENABLE_INTERNAL_TAGLIB=ON -DENABLE_INTERNAL_SWIG=ON
          - platform: wayland
            runner: ubuntu-24.04
            packages: >-
              build-essential cmake gawk gperf gettext libtool meson nasm
              ninja-build pkg-config bison python3-dev unzip zip ccache uuid-dev
              dpkg-dev fakeroot lsb-release
              libass-dev libcurl4-openssl-dev libexiv2-dev libflatbuffers-dev
              libfmt-dev libfreetype-dev libfribidi-dev libfstrcmp-dev
              libharfbuzz-dev liblzo2-dev libpcre2-dev libssl-dev libsqlite3-dev
              libtinyxml-dev zlib1g-dev libcdio-dev libcdio++-dev libgtest-dev
              libgif-dev libjpeg-dev nlohmann-json3-dev libmicrohttpd-dev
              libunistring-dev libspdlog-dev libtinyxml2-dev libcrossguid-dev
              libdbus-1-dev libasound2-dev libdav1d-dev
              libdrm-dev libxkbcommon-dev
              libegl-dev libegl1 libegl-mesa0 libgles2-mesa-dev libgl1-mesa-dri
              libgbm-dev libwayland-dev wayland-protocols waylandpp-dev weston
            cmake_flags: >-
              -DCORE_PLATFORM_NAME=wayland -DAPP_RENDER_SYSTEM=gles
              -DENABLE_INTERNAL_FFMPEG=ON -DENABLE_INTERNAL_TAGLIB=ON -DENABLE_INTERNAL_SWIG=ON
          - platform: wayland
            runner: ubuntu-24.04-arm
            packages: >-
              build-essential cmake gawk gperf gettext libtool meson nasm
              ninja-build pkg-config bison python3-dev unzip zip ccache uuid-dev
              dpkg-dev fakeroot lsb-release
              libass-dev libcurl4-openssl-dev libexiv2-dev libflatbuffers-dev
              libfmt-dev libfreetype-dev libfribidi-dev libfstrcmp-dev
              libharfbuzz-dev liblzo2-dev libpcre2-dev libssl-dev libsqlite3-dev
              libtinyxml-dev zlib1g-dev libcdio-dev libcdio++-dev libgtest-dev
              libgif-dev libjpeg-dev nlohmann-json3-dev libmicrohttpd-dev
              libunistring-dev libspdlog-dev libtinyxml2-dev libcrossguid-dev
              libdbus-1-dev libasound2-dev libdav1d-dev
              libdrm-dev libxkbcommon-dev
              libegl-dev libegl1 libegl-mesa0 libgles2-mesa-dev libgl1-mesa-dri
              libgbm-dev libwayland-dev wayland-protocols waylandpp-dev weston
            cmake_flags: >-
              -DCORE_PLATFORM_NAME=wayland -DAPP_RENDER_SYSTEM=gles
              -DENABLE_INTERNAL_FFMPEG=ON -DENABLE_INTERNAL_TAGLIB=ON -DENABLE_INTERNAL_SWIG=ON
          # libflatbuffers-dev is deliberately absent: 22.04's flatc (2.0.0)
          # would be picked up by FindFlatC and generate schemas the internal
          # 23.3.3 library cannot read.
          - platform: x11
            runner: ubuntu-22.04
            packages: >-
              build-essential cmake gawk gperf gettext libtool meson nasm
              ninja-build pkg-config bison python3-dev unzip zip ccache uuid-dev
              dpkg-dev fakeroot lsb-release
              libass-dev libcurl4-openssl-dev libexiv2-dev
              libfmt-dev libfreetype-dev libfribidi-dev libfstrcmp-dev
              libharfbuzz-dev liblzo2-dev libpcre2-dev libssl-dev libsqlite3-dev
              libtinyxml-dev zlib1g-dev libcdio-dev libcdio++-dev libgtest-dev
              libgif-dev libjpeg-dev nlohmann-json3-dev libmicrohttpd-dev
              libunistring-dev libspdlog-dev libtinyxml2-dev libcrossguid-dev
              libdbus-1-dev libasound2-dev libdav1d-dev libdrm-dev
              libgl-dev libegl-dev libegl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri
              libx11-dev libxext-dev libxrandr-dev
            cmake_flags: >-
              -DCORE_PLATFORM_NAME=x11 -DAPP_RENDER_SYSTEM=gl
              -DENABLE_INTERNAL_FFMPEG=ON -DENABLE_INTERNAL_TAGLIB=ON
              -DENABLE_INTERNAL_FMT=ON -DENABLE_INTERNAL_SPDLOG=ON
              -DENABLE_INTERNAL_EXIV2=ON -DENABLE_INTERNAL_FLATBUFFERS=ON
              -DENABLE_INTERNAL_DAV1D=ON -DENABLE_INTERNAL_SWIG=ON
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y ${{ matrix.packages }}

      - uses: ./.github/actions/ccache-restore
        with:
          key: linux-${{ matrix.platform }}-${{ runner.arch }}
          dir: /home/runner/.cache/kodi-e2e-ccache

      # Without KODI_DEPENDSBUILD, FindFFMPEG fails hard instead of falling back
      # to an internal build when the system ffmpeg is too old. The install
      # prefix is compiled into the binary, so it has to be the one dpkg will
      # install to.
      - name: Configure Kodi
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_GENERATOR=DEB ${{ matrix.cmake_flags }}

      - name: Build Kodi
        run: cmake --build build -- -j"$(nproc)"

      # Native build against the system libraries, installed under the
      # workspace; the .deb does not carry add-ons, so this only proves they
      # still build against this tree.
      - uses: ./.github/actions/build-binary-addons
        with:
          make-args: PREFIX=${{ github.workspace }}/build-addons

      # cmake/cpack/CPackConfigDEB.cmake, see docs/README.Ubuntu.md. The e2e job
      # installs kodi and kodi-bin with apt, so what runs is the installed binary
      # with the dependencies dpkg-shlibdeps recorded.
      - name: Package
        working-directory: build
        run: cpack

      # Uploaded before the unit tests run so the e2e job still gets a build
      # when a unit test fails.
      - uses: actions/upload-artifact@v7
        with:
          name: kodi-deb-linux-${{ matrix.platform }}-${{ runner.arch }}
          path: build/packages/*.deb
          retention-days: 7

      # kodi-test is EXCLUDE_FROM_ALL and whole-archive links the app, so this
      # is a real link step. Built here, before ccache-save, so its compilation
      # is cached too; actually run further down, after the package upload.
      - name: Build unit tests
        run: cmake --build build --target kodi-test -- -j"$(nproc)"

      - uses: ./.github/actions/ccache-save
        if: '!cancelled()'
        with:
          key: linux-${{ matrix.platform }}-${{ runner.arch }}
          save: ${{ github.event_name != 'pull_request' }}

      # Run from the build tree: the reference data the tests read
      # (cmake/installdata/test-reference-data.txt) was mirrored there.
      # TestNetwork.PingHost probes for an unprivileged Linux "ping socket"
      # (SOCK_DGRAM + IPPROTO_ICMP) and skips itself if the kernel's
      # net.ipv4.ping_group_range excludes the runner; granting it here keeps
      # that assertion running instead of skipping.
      - name: Run unit tests
        working-directory: build
        run: |
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
          ./kodi-test --gtest_output=xml:gtestresults.xml

      - uses: ./.github/actions/report-unit-tests
        if: always()
        with:
          name: linux-${{ matrix.platform }}-${{ runner.arch }}

  e2e:
    needs: build
    # Runs the legs whose build succeeded even if another leg's failed.
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: gbm
            runner: ubuntu-24.04
          - platform: gbm
            runner: ubuntu-24.04-arm
          - platform: wayland
            runner: ubuntu-24.04
          - platform: wayland
            runner: ubuntu-24.04-arm
          - platform: x11
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: kodi-deb-linux-${{ matrix.platform }}-${{ runner.arch }}
          path: packages

      # apt resolves the dependencies recorded in the packages. libgl1-mesa-dri
      # holds Mesa's software rasteriser and is loaded at runtime rather than
      # linked, so shlibdeps cannot know about it. X11 additionally needs Xvfb.
      - name: Install Kodi
        run: |
          sudo apt-get update
          extra=""
          [ "${{ matrix.platform }}" = "x11" ] && extra="xvfb x11-utils"
          # shellcheck disable=SC2086
          sudo apt-get install -y ./packages/kodi_*.deb ./packages/kodi-bin_*.deb libgl1-mesa-dri $extra
          echo "KODI_BINARY=$(dpkg -L kodi-bin | grep -E '/kodi/kodi-${{ matrix.platform }}$')" >> "$GITHUB_ENV"

      # vkms ships in linux-modules-extra. CDRMUtils::OpenDrm() takes the first
      # card with a connected connector, which vkms reports and the runner's own
      # virtual card does not. The node is group "video", which the runner user is
      # not in, hence the chmod; udev creates the node shortly after modprobe
      # returns, so settle first or the chmod misses it.
      - name: Load vkms virtual display driver
        if: matrix.platform == 'gbm'
        run: |
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vkms
          sudo udevadm settle
          sudo chmod 666 /dev/dri/card*
          ls -l /dev/dri

      # Ubuntu 24.04's libdrm 2.4.125 predates the kernel's vkms-to-faux_device
      # conversion: drmGetDevices2() cannot classify the faux bus until 2.4.134
      # and silently drops the card, so Kodi reports "No drm devices found". Same
      # version, mirror and meson options as tools/depends/target/libdrm. Installed
      # to /usr/local/lib/<multiarch>, the first directory in the linker's
      # <multiarch>.conf on every architecture; plain /usr/local/lib only wins on
      # x86_64, where that file happens to sort after libc.conf.
      - name: Build libdrm 2.4.134
        if: matrix.platform == 'gbm'
        run: |
          sudo apt-get install -y build-essential meson ninja-build pkg-config
          curl -fsSL -o libdrm.tar.xz https://mirrors.kodi.tv/build-deps/sources/libdrm-2.4.134.tar.xz
          echo "ef2abddea59d1e93c83a48de920431b839ab50d6071ef4da3cf126e7d64ba7b235f2e34e1169d49ad9de2937a0a18acd66bb8d324b067239b1136e0ddbe792a1  libdrm.tar.xz" | sha512sum -c -
          mkdir libdrm-src
          tar -xf libdrm.tar.xz -C libdrm-src --strip-components=1
          meson setup libdrm-src libdrm-build \
            --prefix=/usr/local --libdir="lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)" --buildtype=release \
            -Ddefault_library=shared -Dnouveau=disabled -Domap=disabled \
            -Dexynos=disabled -Dtegra=disabled -Dintel=disabled \
            -Dradeon=disabled -Damdgpu=disabled -Dvmwgfx=disabled \
            -Dvc4=disabled -Dfreedreno=disabled -Detnaviv=disabled \
            -Dcairo-tests=disabled -Dman-pages=disabled -Dvalgrind=disabled \
            -Dfreedreno-kgsl=false -Dinstall-test-programs=false -Dudev=false
          ninja -C libdrm-build
          sudo ninja -C libdrm-build install
          sudo ldconfig

      # CWinSystemGbm refuses to start if DISPLAY or WAYLAND_DISPLAY is set at
      # all, so these are only ever exported for the leg that needs them, via
      # GITHUB_ENV from inside that leg's own step, never declared on the job.
      # Weston prints no ready message, so the socket is polled for.
      - name: Start headless Wayland compositor (Weston)
        if: matrix.platform == 'wayland'
        env:
          XDG_RUNTIME_DIR: /tmp/xdg-runtime-kodi-e2e
          WAYLAND_DISPLAY: wayland-1
        run: |
          sudo apt-get install -y weston
          echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}" >> "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=${WAYLAND_DISPLAY}" >> "$GITHUB_ENV"
          mkdir -p "${XDG_RUNTIME_DIR}"
          chmod 0700 "${XDG_RUNTIME_DIR}"
          weston --backend=headless-backend.so --renderer=gl \
            --socket="${WAYLAND_DISPLAY}" --no-config --idle-time=0 &
          for _ in $(seq 1 30); do
            [ -S "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}" ] && break
            sleep 1
          done
          [ -S "${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY}" ] || {
            echo "::error::Weston did not create ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY} in time"
            exit 1
          }

      # Xvfb prints no ready message, so xdpyinfo is polled.
      - name: Start headless X server (Xvfb)
        if: matrix.platform == 'x11'
        run: |
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1920x1080x24 &
          for _ in $(seq 1 30); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display :99 >/dev/null 2>&1 || {
            echo "::error::Xvfb did not become ready on display :99 in time"
            exit 1
          }

      - name: Re-assert DRM node permissions
        if: matrix.platform == 'gbm'
        run: |
          sudo chmod 666 /dev/dri/card*
          ls -l /dev/dri

      # The installed binary is run directly, not through the /usr/bin/kodi
      # wrapper script, which hides the exit code and does not forward signals.
      # Its profile goes under the workspace via KODI_DATA. No audio or input
      # hardware on the runner; Kodi tolerates both being absent and everything
      # is driven over JSON-RPC.
      - uses: ./.github/actions/run-e2e
        with:
          name: linux-${{ matrix.platform }}-${{ runner.arch }}
          kodi-binary: ${{ env.KODI_BINARY }}
          kodi-profile-dir: ${{ github.workspace }}/e2e-profile
          log-paths: |
            e2e-profile/temp/kodi.log
            e2e-profile/temp/process-output.log
          screenshot-glob: e2e-profile/screenshots/*.png
