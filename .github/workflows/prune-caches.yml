name: Prune caches

# Keeps only the newest Actions cache entry of each kind per branch. CodeQL's
# overlay databases and dependency caches, and ccache, save a new entry per
# commit and restore only the newest, so older entries just push the repository
# towards its cache limit, where eviction removes the entries still in use.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: prune-caches

jobs:
  prune:
    if: github.repository == 'xbmc/xbmc' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Entries of a kind share the key up to a trailing commit or content hash,
      # optionally followed by run id and attempt.
      - name: Delete superseded entries
        run: |
          gh cache list --limit 10000 --json id,key,ref,createdAt \
            | jq -r 'group_by(.ref + " " + (.key | sub("(-[0-9a-f]{40,64})(-[0-9]+)*$"; "")))
                     | map(sort_by(.createdAt) | reverse | .[1:]) | flatten | .[]
                     | "\(.id)\t\(.ref)\t\(.key)"' \
            | while IFS=$'\t' read -r id ref key; do
                echo "Deleting ${ref} ${key}"
                gh cache delete "${id}" || true
              done
