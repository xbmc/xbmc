name: E2E (macOS)

# End-to-end smoke test for docs/E2E-TESTING.md.
#
# Builds Kodi from source on a GitHub-hosted macOS runner, launches it with a
# disposable portable profile, confirms the JSON-RPC webserver responds to a ping,
# takes and sanity-checks a screenshot, asks it to quit cleanly, and checks the log
# for fatal errors. See tools/e2e/README.md for what this does and does not cover.
#
# Runs on every non-draft PR commit, on pushes to master, and on workflow_dispatch
# (any branch/ref), so it can also be exercised on a feature branch before merge.

on:
  workflow_dispatch:
  push:
    branches: [master]
  # Every commit of a PR, once it is out of draft: `synchronize` covers pushes to
  # an open PR, `ready_for_review` starts a run when a draft is marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: e2e-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-smoke:
    # Draft PRs are skipped - they run as soon as they are marked ready for review.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    # macos-14 is Apple Silicon (arm64). Bump deliberately, don't float on
    # macos-latest, so cache keys and toolchain behavior stay predictable.
    runs-on: macos-14
    timeout-minutes: 180
    env:
      HOST_TRIPLET: aarch64-apple-darwin
      CCACHE_DIR: /Users/runner/.cache/kodi-e2e-ccache
      # ccache's defaults are a poor fit for CI: restoring the cache rewrites every
      # file's mtime, which defeats direct mode, and a Debug build hashes the build
      # directory because debug info embeds absolute paths. Together those held the
      # hit rate near 10%. compilercheck=content also matters wherever the compiler
      # itself comes out of a restored tools/depends tree.
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
      CCACHE_NOHASHDIR: "true"
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: "1G"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ccache
        run: brew install ccache

      # hashFiles('tools/depends/**') looks like the obvious cache-key input, but that
      # glob also matches the (huge, untracked) extracted/built dependency trees that
      # end up inside tools/depends after a build, not just its checked-in recipe
      # files - hashing all of that blows past GitHub's hard 120s hashFiles timeout.
      # Use the git tree hash of tools/depends instead: it only reflects committed
      # files, changes exactly when the depends recipes change, and is effectively
      # instant regardless of how much build output has accumulated alongside it.
      - name: Compute tools/depends cache key
        id: depends-key
        run: echo "hash=$(git rev-parse HEAD:tools/depends)" >> "$GITHUB_OUTPUT"

      # tools/depends output is the single biggest time cost in this workflow
      # (building ffmpeg and friends from scratch can take well over an hour).
      # It only needs to be rebuilt when the depends build system itself changes.
      #
      # Restore/save are split (rather than the combined actions/cache action) because
      # its save step defaults to post-if: success() - a later step failing (e.g. Build
      # Kodi) would silently skip saving, discarding a fully-built depends tree. Saving
      # explicitly with if: always() keeps it even when a later step fails.
      # Caching only the install prefix isn't enough: make's up-to-date checks for
      # each dependency key off .configured-*/.installed-* stamp files, the
      # extracted/built source trees under tools/depends/{native,target}/*/, the
      # generated Makefile.include, and each package's own (git-tracked) Makefile/
      # VERSION/patch files and download-files.include - and actions/checkout always
      # hands all of the latter back with mtime "now", always newer than any cached
      # stamp, which invalidates every dependency's stamp regardless of the prefix
      # cache. Caching the whole tools/depends tree (not enumerating individual
      # paths within it) sidesteps having to know which specific files matter: on a
      # hit the key already guarantees byte-identical content (it's the tools/depends
      # tree hash - see below), and tar preserves each file's original mtime on
      # restore, so the correct relative ordering (sources older than stamps) comes
      # back automatically, for anything currently in the tree and anything added to
      # it later.
      - name: Restore Kodi dependencies cache (tools/depends)
        id: depends-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /Users/Shared/xbmc-depends
            tools/depends
          key: macos-${{ runner.arch }}-depends-${{ steps.depends-key.outputs.hash }}

      # Secondary cache: speeds up rebuilding xbmc/ core sources across commits even
      # when tools/depends itself didn't change.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-${{ runner.arch }}-ccache-${{ github.sha }}
          restore-keys: |
            macos-${{ runner.arch }}-ccache-

      - name: Configure and build dependencies
        working-directory: tools/depends
        run: |
          ./bootstrap
          ./configure --host="${HOST_TRIPLET}" --with-platform=macos
          make -j"$(sysctl -n hw.ncpu)"

      - name: Generate Kodi build system
        run: make -C tools/depends/target/cmakebuildsys

      - name: Build Kodi
        run: make -j"$(sysctl -n hw.ncpu)" -C build

      - name: Show ccache stats
        if: always()
        run: ccache -s || true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.1
        with:
          enable-cache: true
          cache-dependency-glob: "tools/e2e/uv.lock"

      - name: Run E2E smoke test
        working-directory: tools/e2e
        env:
          # macOS builds Kodi as a Kodi.app bundle (CMakeLists.txt MACOSX_BUNDLE), not a
          # bare kodi.bin like Linux - see driver/launcher.py's _resolve_app_root for how
          # the test driver locates portable_data relative to this.
          KODI_BINARY: ${{ github.workspace }}/build/Kodi.app/Contents/MacOS/Kodi
        run: uv run pytest scenarios -v --junitxml=../../e2e-results.xml

      - name: Upload Kodi log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kodi-macos-log
          # portable_data lives under the .app bundle's Resources/<AppName>, not next
          # to the binary in Contents/MacOS - see driver/launcher.py's
          # _resolve_app_root. process-output.log (driver-captured stdout/stderr)
          # covers crashes early enough that Kodi's own kodi.log never got created.
          path: |
            build/Kodi.app/Contents/Resources/Kodi/portable_data/temp/kodi.log
            build/Kodi.app/Contents/Resources/Kodi/portable_data/temp/process-output.log
          if-no-files-found: warn

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kodi-macos-screenshot
          path: build/Kodi.app/Contents/Resources/Kodi/portable_data/screenshots/*.png
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e-results.xml
          if-no-files-found: warn

      # Skipped on an exact key hit: nothing changed, so re-uploading would just waste
      # time. On a miss (including a partial/failed build), save whatever got built.
      #
      # !cancelled() matters here: actions/cache is write-once per key, and a push
      # that cancels an in-flight run (this workflow's own concurrency group does
      # exactly that) can stop this step at an arbitrary, partial point - always()
      # alone would still save that incomplete state under this tools/depends
      # tree's permanent key, and every later run would keep restoring and
      # rebuilding past that same incomplete point forever. A genuine build
      # failure is still fine to save partial progress from - only a
      # cancellation isn't a real stopping point.
      - name: Save Kodi dependencies cache (tools/depends)
        if: '!cancelled() && steps.depends-cache.outputs.cache-hit != ''true'''
        uses: actions/cache/save@v6
        with:
          path: |
            /Users/Shared/xbmc-depends
            tools/depends
          key: macos-${{ runner.arch }}-depends-${{ steps.depends-key.outputs.hash }}

      - name: Save ccache
        # Not on pull_request: cache entries are immutable, so every push to a
        # PR would add another ~600MB entry rather than replace one, and
        # the repo's 10GB budget then evicts the entries that are actually useful.
        # PR runs still restore.
        if: "!cancelled() && github.event_name != 'pull_request'"
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-${{ runner.arch }}-ccache-${{ github.sha }}
