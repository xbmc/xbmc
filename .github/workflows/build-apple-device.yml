name: Build (iOS/tvOS device)

# Cross-builds Kodi.app for iOS and tvOS device ABIs via tools/depends, with
# peripheral.joystick bundled, and produces the unsigned .ipa (CPack) and the
# dSYM bundle as artifacts, which is what Jenkins' IOS-ARM64 and TVOS jobs
# upload. Signing needs a provisioning profile Kodi does not ship, so the
# archive is unsigned (CODE_SIGNING_ALLOWED=NO); the Simulator ABIs and the
# E2E run live in e2e-apple-simulator.yml.

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: build-apple-device-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEPENDS_PREFIX: /Users/Shared/xbmc-depends

jobs:
  build:
    # Drafts are skipped; ready_for_review starts the first run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # macos-14 is Apple Silicon; pinned so cache keys and toolchain stay stable.
    runs-on: macos-14
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            sdk_dir: Debug-iphoneos
          - platform: tvos
            sdk_dir: Debug-appletvos
    steps:
      - uses: actions/checkout@v7

      # The image ships several Xcodes; the newest is picked rather than pinning
      # a version the image may not have.
      - name: Select latest available Xcode
        run: |
          latest_xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)
          if [ -n "$latest_xcode" ]; then
            sudo xcode-select -s "$latest_xcode"
          fi
          xcodebuild -version

      - name: Install ccache
        run: brew install ccache

      - uses: ./.github/actions/depends-cache-restore
        id: depends-cache
        with:
          platform: ${{ matrix.platform }}-${{ runner.arch }}
          prefix: ${{ env.DEPENDS_PREFIX }}

      - uses: ./.github/actions/ccache-restore
        with:
          key: ${{ matrix.platform }}-${{ runner.arch }}
          dir: /Users/runner/.cache/kodi-e2e-ccache

      - name: Configure and build dependencies
        id: depends
        working-directory: tools/depends
        run: |
          ./bootstrap
          ./configure --host=aarch64-apple-darwin --with-platform=${{ matrix.platform }} --prefix="${DEPENDS_PREFIX}"
          make -j"$(sysctl -n hw.ncpu)"

      # Installed into the source tree's addons/ directory (the darwin default
      # in tools/depends/xbmc-addons.include), which the app bundle includes.
      - uses: ./.github/actions/build-binary-addons

      - name: Generate Xcode project
        run: make -C tools/depends/target/cmakebuildsys

      # The ipa target depends on the app target, so this builds Kodi and then
      # runs CPack for the archive (cmake/scripts/darwin_embedded/Install.cmake).
      - name: Build Kodi and package .ipa
        working-directory: build
        run: xcodebuild -config Debug -jobs "$(sysctl -n hw.ncpu)" -target ipa CODE_SIGNING_ALLOWED=NO

      - uses: ./.github/actions/upload-build-logs
        if: always()
        with:
          name: ${{ matrix.platform }}-device

      - uses: ./.github/actions/ccache-save
        if: '!cancelled()'
        with:
          key: ${{ matrix.platform }}-${{ runner.arch }}
          save: ${{ github.event_name != 'pull_request' }}

      - uses: ./.github/actions/depends-cache-save
        if: '!cancelled() && steps.depends.outcome == ''success'' && github.event_name != ''pull_request'' && steps.depends-cache.outputs.cache-hit != ''true'''
        with:
          platform: ${{ matrix.platform }}-${{ runner.arch }}
          prefix: ${{ env.DEPENDS_PREFIX }}

      # Tarred so the bundle's directory structure survives the artifact round
      # trip; the .ipa is already a zip.
      - name: Collect .ipa and dSYM
        run: |
          ipa=$(find build/tools/darwin/packaging/darwin_embedded -maxdepth 1 -name '*.ipa' -print -quit)
          dsym="build/build/${{ matrix.sdk_dir }}/Kodi.app.dSYM"
          [ -n "$ipa" ] || { echo "::error::No .ipa produced under build/tools/darwin/packaging/darwin_embedded"; exit 1; }
          [ -d "$dsym" ] || { echo "::error::No dSYM at $dsym"; exit 1; }
          mkdir -p dist
          cp "$ipa" dist/
          tar -cf "dist/$(basename "$ipa" .ipa).dSYM.tar" -C "$(dirname "$dsym")" Kodi.app.dSYM

      - uses: actions/upload-artifact@v7
        with:
          name: kodi-${{ matrix.platform }}-device
          path: dist/*
          if-no-files-found: error
          retention-days: 7
