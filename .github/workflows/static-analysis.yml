name: Static analysis

# clang-tidy and cppcheck, replacing Jenkins' static analysis job. Pull
# requests get advisory clang-tidy annotations on the lines they change;
# master runs both analysers on everything and uploads to code scanning.
# Both need a built tree, since Kodi generates headers during the build.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_ARGS: >-
    -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    -DCORE_PLATFORM_NAME="wayland gbm" -DAPP_RENDER_SYSTEM=gles
    -DENABLE_INTERNAL_FFMPEG=ON -DENABLE_INTERNAL_TAGLIB=ON -DENABLE_INTERNAL_SWIG=ON
    -DCMAKE_C_FLAGS_DEBUG=-g0 -DCMAKE_CXX_FLAGS_DEBUG=-g0

jobs:
  clang-tidy-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-linux-build
        with:
          platforms: wayland gbm
          extra-packages: clang-tidy-18 clang-tools-18

      - uses: ./.github/actions/ccache-restore
        with:
          key: linux-analysis-${{ runner.arch }}
          dir: /home/runner/.cache/kodi-ccache

      - name: Configure Kodi
        run: cmake -S . -B build ${{ env.CMAKE_ARGS }}

      - name: Build Kodi
        run: cmake --build build -- -j"$(nproc)"

      - uses: ./.github/actions/ccache-save
        if: '!cancelled()'
        with:
          key: linux-analysis-${{ runner.arch }}
          save: false

      - name: Run clang-tidy on the changed lines
        run: |
          git diff -U0 --no-color "$(git merge-base HEAD^1 HEAD^2)" "$(git rev-parse HEAD^2)" -- 'xbmc/*.cpp' 'xbmc/*.h' \
            | clang-tidy-diff-18.py -p1 -path build -j"$(nproc)" -clang-tidy-binary clang-tidy-18 \
            | tee clang-tidy-diff.txt
          python3 .github/scripts/analysis_to_sarif.py --clang-tidy clang-tidy-diff.txt --annotate

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clang-tidy-diff
          path: clang-tidy-diff.txt
          if-no-files-found: ignore
          retention-days: 14

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-linux-build
        with:
          platforms: wayland gbm
          extra-packages: clang-tidy-18 clang-tools-18 cppcheck

      - name: Select clang-tidy
        run: sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      - uses: ./.github/actions/ccache-restore
        with:
          key: linux-analysis-${{ runner.arch }}
          dir: /home/runner/.cache/kodi-ccache

      - name: Configure Kodi
        run: cmake -S . -B build ${{ env.CMAKE_ARGS }} -DENABLE_CLANGTIDY=ON

      # kodi-test is named so the test sources are analysed too.
      - name: Build Kodi with clang-tidy
        shell: bash
        run: cmake --build build --target kodi kodi-test -- -j"$(nproc)" 2>&1 | tee build/clang-tidy.log

      - name: Run cppcheck
        run: cmake --build build --target analyze-cppcheck -- -j"$(nproc)"

      - uses: ./.github/actions/ccache-save
        if: '!cancelled()'
        with:
          key: linux-analysis-${{ runner.arch }}
          save: ${{ github.event_name != 'pull_request' }}

      - name: Convert results to SARIF
        run: |
          python3 .github/scripts/analysis_to_sarif.py --clang-tidy build/clang-tidy.log \
            --sarif clang-tidy.sarif --tool-version "$(clang-tidy --version | grep -o '[0-9][0-9.]*' | head -1)"
          python3 .github/scripts/analysis_to_sarif.py --cppcheck build/cppcheck-result.xml \
            --sarif cppcheck.sarif --tool-version "$(cppcheck --version | grep -o '[0-9][0-9.]*' | head -1)"

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: clang-tidy.sarif
          category: clang-tidy

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: cppcheck.sarif
          category: cppcheck

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-analysis-results
          path: |
            build/clang-tidy.log
            build/cppcheck-result.xml
            clang-tidy.sarif
            cppcheck.sarif
          if-no-files-found: warn
          retention-days: 30
