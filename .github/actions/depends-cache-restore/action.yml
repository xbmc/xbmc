name: Restore tools/depends prefix
description: >
  Restores the tools/depends install prefix cached under the given key for the
  current tools/depends tree hash. Only the prefix is cached: configure-depends
  regenerates everything the Kodi and add-on builds read from the tree itself.
inputs:
  key:
    description: Cache key prefix, unique per depends platform and configuration (e.g. android-x86_64-debug).
    required: true
  prefix:
    description: The --prefix the dependencies were installed to.
    required: true
  fail-on-cache-miss:
    description: Fail the job when there is no entry for the key.
    default: "false"
outputs:
  cache-hit:
    description: Whether the key was an exact hit ("true" or "false").
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Compute cache key
      id: key
      shell: bash
      run: echo "hash=$(git rev-parse HEAD:tools/depends)" >> "$GITHUB_OUTPUT"

    - name: Restore
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ inputs.prefix }}
        key: ${{ inputs.key }}-depends-${{ steps.key.outputs.hash }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}
